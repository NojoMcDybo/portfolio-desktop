<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nojo – Desktop-Portfolio</title>
  <meta name="description" content="Mein Desktop: Arena, Vantage, Notch, Haze, Streamdock, Kursbuch und meine Lernseiten – alles selbst gebaut, im Browser ausprobierbar, mit Installer zum Download.">
  <meta name="theme-color" content="#0b0b0d">
  <meta property="og:title" content="Nojo – Desktop-Portfolio">
  <meta property="og:description" content="Eigene Programme und Lernseiten, direkt im Browser ausprobieren.">
  <link rel="icon" href="assets/icons/notch.png">
  <link rel="stylesheet" href="src/nojo-ui.css">
  <link rel="stylesheet" href="src/shell.css">
  <script defer src="vendor/motion-13.5.0.js"></script>
  <script type="module" src="src/main.js"></script>
</head>
<body class="booting">
  <!-- Der Desktop liegt fertig und gerade da; das Intro-Glas darüber löst sich auf, wenn man den Balken hochzieht -->
  <div id="desktop" aria-hidden="true">
    <div class="wallpaper" aria-hidden="true"><i></i><i></i><i></i></div>

    <header id="menubar">
      <div class="mb-left">
        <button class="mb-item mb-logo" id="mb-logo" aria-label="Nojo-Menü" aria-haspopup="menu"><span>N</span></button>
        <span class="mb-app" id="mb-app">Desktop</span>
        <button class="mb-item" data-menu="fenster" aria-haspopup="menu">Fenster</button>
        <button class="mb-item" data-menu="hilfe" aria-haspopup="menu">Hilfe</button>
      </div>
      <div class="mb-right">
        <a class="mb-item" href="https://github.com/NojoMcDybo" target="_blank" rel="noopener" aria-label="GitHub-Profil">GitHub</a>
        <time class="mb-item" id="mb-clock"></time>
      </div>
    </header>

    <div id="notch-root"></div>

    <div id="icons" role="list" aria-label="Desktop"></div>
    <div id="windows"></div>

    <nav id="dock" aria-label="Programme"><div class="dock-bar" id="dock-bar"></div></nav>
    <div id="menu" role="menu" hidden></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>

  <!-- Intro: ein Diffusor-Glas, das mit dem Kippwinkel aufklappt. Die Seite bleibt gerade; vier Weichzeichner-Ebenen darüber werden mit dem
       Abstand zum Scharnier (unten) stärker und mit dem Winkel schwächer. Der Schriftzug liegt unter dem Glas und wird mit ihm scharf. -->
  <div id="stage" aria-label="Intro">
    <div class="hero" id="hero" aria-hidden="true">
      <span>Desktop-Portfolio</span>
      <b>Nojo</b>
      <span class="hero-sub">Eigene Programme – direkt im Browser ausprobieren</span>
    </div>
    <div class="veil v1"></div><div class="veil v2"></div><div class="veil v3"></div><div class="veil v4"></div>
    <div class="veil-dim" id="veil-dim"></div>
    <div class="pull" id="pull">
      <div class="pull-nudge" id="pull-nudge">
        <button class="pull-bar" id="open-btn" type="button" aria-label="Zum Öffnen nach oben ziehen oder Enter drücken"><i></i></button>
        <span class="pull-hint" id="pull-hint">Zum Öffnen nach oben ziehen</span>
      </div>
    </div>
    <div class="stage-ui" id="stage-ui">
      <button class="skip-btn" id="skip-btn" type="button">Intro überspringen</button>
    </div>
  </div>

  <noscript>
    <p style="position:fixed;inset:0;display:grid;place-items:center;background:#0b0b0d;color:#f5f5f7;font:16px system-ui;text-align:center;padding:24px">
      Dieses Portfolio ist ein Desktop im Browser und braucht JavaScript.<br>Meine Programme findest du auch direkt auf github.com/NojoMcDybo.
    </p>
  </noscript>
</body>
</html>
