<!doctype html>
<html lang="en">
<head>
<script src="../../shim/app-english-daily.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Daily</title>
<style>
:root{color-scheme:light}
body{margin:0}[hidden]{display:none!important}
/* English Daily. One calm column of cards on a cool grey ground.
   Colour is spent only where it means something: blue for "press / selected", the four track hues for subject,
   green and red for right and wrong. All values come from tools/palette.js (OKLCH, contrast-checked); no literal colours below. */
:root {
  --bg: #f2f3f6; --panel: #ffffff; --panel2: #eaecef; --line: #e0e2e5; --line2: #d1d3d8; --edge: #86898f;
  --ink: #16181d; --muted: #55585f; --faint: #696c72; --acc: #0767d3; --acc-ink: #015cc0; --acc-bg: #e7f1ff;
  --acc-on: #ffffff; --on: #ffffff; --ok: #034b1f; --ok-bg: #def8e2; --bad: #b64340; --bad-bg: #ffebe9;
  --pen: #b64340; --cA: #b5820c; --cAi: #704e01; --cAbg: #faefdd; --cB: #08aeae; --cBi: #066262; --cBbg: #ddf6f5;
  --cC: #926abe; --cCi: #644288; --cCbg: #f4ecff; --cD: #9e4573; --cDi: #82365e; --cDbg: #ffe9f3; --shadow: 0 1px 2px rgba(28, 28, 40, .05), 0 12px 28px -18px rgba(28, 28, 40, .22);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b1c1e; --panel: #242527; --panel2: #2e2f32; --line: #37383b; --line2: #46484b; --edge: #7e8085;
  --ink: #f4f5f6; --muted: #b6b7bb; --faint: #909296; --acc: #76bafe; --acc-ink: #8ac3fe; --acc-bg: #1c314c;
  --acc-on: #0b1726; --on: #0b1726; --ok: #7fe998; --ok-bg: #14361d; --bad: #e66e68; --bad-bg: #4b1d1b;
  --pen: #e66e68; --cA: #deaf5c; --cAi: #e6bd77; --cAbg: #392b14; --cB: #56dbdb; --cBi: #6cd9d8; --cBbg: #0f3434;
  --cC: #bc98e5; --cCi: #d3b4f9; --cCbg: #33283f; --cD: #c6739c; --cDi: #f6a9cd; --cDbg: #3e2531; --shadow: 0 0 0 1px rgba(255, 255, 255, .035), 0 14px 30px -18px rgba(0, 0, 0, .7);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1b1c1e; --panel: #242527; --panel2: #2e2f32; --line: #37383b; --line2: #46484b; --edge: #7e8085;
  --ink: #f4f5f6; --muted: #b6b7bb; --faint: #909296; --acc: #76bafe; --acc-ink: #8ac3fe; --acc-bg: #1c314c;
  --acc-on: #0b1726; --on: #0b1726; --ok: #7fe998; --ok-bg: #14361d; --bad: #e66e68; --bad-bg: #4b1d1b;
  --pen: #e66e68; --cA: #deaf5c; --cAi: #e6bd77; --cAbg: #392b14; --cB: #56dbdb; --cBi: #6cd9d8; --cBbg: #0f3434;
  --cC: #bc98e5; --cCi: #d3b4f9; --cCbg: #33283f; --cD: #c6739c; --cDi: #f6a9cd; --cDbg: #3e2531; --shadow: 0 0 0 1px rgba(255, 255, 255, .035), 0 14px 30px -18px rgba(0, 0, 0, .7);
  color-scheme: dark;
}
:root {
  --trk: var(--acc); --trk-ink: var(--acc-ink); --trk-bg: var(--acc-bg);
  --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
  --sans: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI Variable Text', 'Segoe UI', Roboto, sans-serif;
  --penf: 'Caveat', 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive;
  --ipaf: 'Noto Serif', 'Gentium Plus', 'Charis SIL', 'DejaVu Serif', 'Times New Roman', serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --r: 18px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: auto; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 var(--sans); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; }
#app { max-width: 720px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--acc) 62%, transparent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4, p, ul, ol { margin: 0; }
h1, h2 { font-family: var(--serif); font-weight: 600; line-height: 1.15; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: clamp(1.9rem, 6.4vw, 2.5rem); }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.05rem; font-weight: 700; }
.sec { font: 700 .76rem/1.2 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
.sub { color: var(--muted); font-size: .95rem; text-wrap: pretty; }
.ipa { font-family: var(--ipaf); }
code { font-family: var(--mono); font-size: .92em; background: var(--panel2); padding: .05em .35em; border-radius: 6px; }
em { font-style: italic; }
mark { background: var(--acc-bg); color: inherit; padding: 0 .15em; border-radius: 4px; }

/* track colour: identity only (badge, card edge, bars, key-points tint) */
.tA { --trk: var(--cA); --trk-ink: var(--cAi); --trk-bg: var(--cAbg); }
.tB { --trk: var(--cB); --trk-ink: var(--cBi); --trk-bg: var(--cBbg); }
.tC { --trk: var(--cC); --trk-ink: var(--cCi); --trk-bg: var(--cCbg); }
.tD { --trk: var(--cD); --trk-ink: var(--cDi); --trk-bg: var(--cDbg); }

/* ---------- header / nav ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 0 10px; }
.brand { display: flex; align-items: center; gap: 10px; }
.mark { width: 32px; height: 32px; border-radius: 10px; background: var(--acc); color: var(--acc-on); display: grid; place-items: center; font: 600 1.2rem/1 var(--serif); }
.word { font: 600 1.22rem/1 var(--serif); letter-spacing: -.01em; }
.word em { color: var(--acc-ink); }
.top-r { display: flex; align-items: center; gap: 10px; }
.sync { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.streak { display: inline-flex; align-items: baseline; gap: .3em; border: 1px solid var(--line2); border-radius: 999px; padding: .2em .8em; font-size: .9rem; color: var(--muted); background: var(--panel); }
.streak b { font: 700 1.05rem var(--serif); color: var(--ink); font-variant-numeric: tabular-nums; }
.streak.on { border-color: var(--ok); }
.streak.on b { color: var(--ok); }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--panel2); border-radius: 999px; margin: 6px 0 20px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 6px); z-index: 4; }
.tab { flex: 1; text-align: center; padding: .55em .4em; border-radius: 999px; color: var(--muted); text-decoration: none; font-weight: 700; font-size: .92rem; }
.tab:hover { color: var(--ink); }
.tab.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }

/* ---------- generic ---------- */
.view { display: flex; flex-direction: column; gap: 16px; padding-bottom: 32px; flex: 1; }
.hello { display: grid; gap: 4px; padding: 6px 0 2px; }
.date { font: 700 .76rem/1.2 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; box-shadow: var(--shadow); display: grid; gap: 12px; }
.card.note { background: var(--panel2); box-shadow: none; border-color: transparent; }
.card.note ul { padding-left: 1.2em; display: grid; gap: 6px; color: var(--ink); font-size: .95rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { border: 1px solid var(--line2); background: var(--panel); border-radius: 14px; padding: .65em 1.1em; font-weight: 700; min-height: 46px; transition: transform .08s ease, background .15s; }
.btn:hover:not(:disabled) { background: var(--panel2); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--acc); border-color: transparent; color: var(--acc-on); }
.btn.primary:hover:not(:disabled) { background: var(--acc); filter: brightness(1.07); }
.btn.big { padding: .8em 1.5em; font-size: 1.05rem; min-height: 52px; }
.btn.ghost { background: transparent; }
.btn.danger { border-color: var(--bad); color: var(--bad); background: transparent; }
.btn.link { border: 0; background: none; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-weight: 400; padding-inline: .6em; }
.btn.mini, .chip.mini { min-height: 36px; font-size: .85rem; }
.badge { display: inline-grid; place-items: center; min-width: 2.1em; height: 2.1em; padding: 0 .5em; border-radius: 10px; background: var(--trk-bg); color: var(--trk-ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--trk) 38%, transparent); font: 700 .8rem var(--sans); letter-spacing: .02em; flex: none; }
.pill { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--line2); border-radius: 999px; padding: .1em .7em; color: var(--muted); }
.kicker { font: 700 .75rem/1.2 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.note { color: var(--muted); font-size: .95rem; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: .6em 1.2em; border-radius: 999px; font-weight: 700; z-index: 20; animation: fadeout 3.5s forwards; }
@keyframes fadeout { 0%, 80% { opacity: 1 } 100% { opacity: 0; pointer-events: none } }

/* ---------- Today ---------- */
.card.main { border-top: 3px solid var(--trk); gap: 10px; }
.cardhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.trk { font: 700 .76rem/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--trk-ink); }
.card.main h2 { margin-top: 4px; }
.meta { color: var(--muted); font-size: .92rem; font-variant-numeric: tabular-nums; }
.card.main .row { margin-top: 6px; }
.card.resume { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--panel2); box-shadow: none; border-color: transparent; }
.donecard { display: flex; align-items: center; gap: 18px; background: var(--panel2); box-shadow: none; border-color: transparent; }
.donecard h2 { font-size: 1.25rem; margin: 2px 0; }
.stamp { width: 132px; height: 132px; border: 3px double var(--acc-ink); border-radius: 50%; display: grid; place-content: center; text-align: center; color: var(--acc-ink); transform: rotate(-9deg); flex: none; line-height: 1;
  font: 700 .72rem var(--sans); letter-spacing: .18em; text-transform: uppercase; animation: stamp .5s cubic-bezier(.2, 1.4, .4, 1) both; }
.stamp b { font: 600 2.6rem/1 var(--serif); letter-spacing: 0; margin: 2px 0; font-variant-numeric: tabular-nums; }
.stamp.small { width: 84px; height: 84px; font-size: .5rem; animation: none; }
.stamp.small b { font-size: 1.7rem; }
@keyframes stamp { from { transform: rotate(-20deg) scale(1.6); opacity: 0 } to { transform: rotate(-9deg) scale(1); opacity: 1 } }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 4px 2px; }
.wd { display: grid; justify-items: center; gap: 5px; }
.wd .dot { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line2); display: grid; place-items: center; font-size: .8rem; font-weight: 700; color: var(--on); }
.wd .lbl { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.wd.done .dot { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.wd.some .dot { border-color: var(--acc); }
.wd.today .lbl { color: var(--ink); font-weight: 700; }
.wd.today .dot { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--line2); }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.bonus-btn { text-align: left; display: grid; gap: 4px; align-content: start; padding: 14px; border: 1px solid var(--line2); border-radius: 14px; background: var(--panel); }
.bonus-btn b { font-size: .98rem; }
.bonus-btn span { color: var(--muted); font-size: .84rem; line-height: 1.35; }
.bonus-btn:hover:not(:disabled) { background: var(--panel2); }
.bonus-btn:disabled { opacity: .5; cursor: not-allowed; }
.uplist { list-style: none; padding: 0; display: grid; gap: 8px; }
.uplist li { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
.uplist .ut { flex: 1; min-width: 0; font-weight: 700; }
.uplist .ud { color: var(--muted); font-size: .84rem; white-space: nowrap; }

/* ---------- Library / Progress ---------- */
.trackblock { display: grid; gap: 10px; }
.trackhead { display: flex; align-items: center; gap: 12px; }
.trackhead > div { flex: 1; min-width: 0; }
.trackhead .cnt { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 700; }
.rows { display: grid; gap: 6px; }
.lrow { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; min-height: 56px; }
.lrow:hover { background: var(--panel2); }
.lrow .code { font: 700 .82rem var(--sans); color: var(--trk-ink, var(--muted)); min-width: 2.6em; }
.lrow .lt { flex: 1; min-width: 0; display: grid; }
.lrow .lt small { color: var(--muted); }
.lrow .ls { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 700; }
.lrow.done .chk { color: var(--ok); }
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 2px; }
.kpi b { font: 600 2rem/1.1 var(--serif); font-variant-numeric: tabular-nums; }
.kpi span { color: var(--muted); font-size: .9rem; }
.kpi small { color: var(--faint); }
/* heat map: one hue (the accent) in four steps; a dot marks a day that finished the daily session */
.heat { --cell: 22px; display: grid; grid-template-rows: repeat(7, auto); grid-auto-flow: column; grid-auto-columns: minmax(0, var(--cell)); gap: 4px; max-width: calc(13 * var(--cell) + 12 * 4px); }
.hc { display: block; position: relative; aspect-ratio: 1; border-radius: 5px; background: var(--panel2); min-width: 0; }
.hc.l1 { background: color-mix(in srgb, var(--acc) 30%, var(--panel2)); } .hc.l2 { background: color-mix(in srgb, var(--acc) 62%, var(--panel2)); } .hc.l3 { background: var(--acc); }
.hc.lf { background: transparent; }
.hc.dd::after { content: ''; position: absolute; inset: 34%; border-radius: 50%; background: var(--acc-ink); }
.hc.l3.dd::after { background: var(--acc-on); }
.legend { display: flex; align-items: center; justify-content: flex-start; gap: 4px; margin-top: 8px; font-size: .75rem; color: var(--muted); }
.legend .hc { width: 14px; height: 14px; aspect-ratio: auto; }
.trow { display: flex; gap: 12px; align-items: center; }
.tr-m { flex: 1; min-width: 0; display: grid; gap: 6px; }
.tr-l { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.tr-l span { color: var(--muted); }
.bar { height: 8px; border-radius: 99px; background: var(--panel2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--trk); border-radius: 99px; transition: width .4s; }
.boxes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; align-items: end; }
.bx { display: grid; justify-items: center; gap: 4px; text-align: center; }
.bx .n { font: 600 1.3rem var(--serif); font-variant-numeric: tabular-nums; }
.bx .bb { width: 100%; max-width: 54px; height: 70px; background: var(--panel2); border-radius: 8px; display: flex; align-items: flex-end; overflow: hidden; }
.bx .bb i { display: block; width: 100%; background: var(--acc); min-height: 0; }
.bx .l { font-weight: 700; font-size: .8rem; }
.bx small { color: var(--muted); font-size: .72rem; line-height: 1.2; }

/* ---------- Settings ---------- */
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.setrow + .setrow { border-top: 1px solid var(--line); padding-top: 14px; }
.segctl { display: inline-flex; padding: 4px; gap: 4px; border-radius: 12px; background: var(--panel2); }
.segctl button { border: 0; background: none; padding: .45em .95em; border-radius: 9px; font-weight: 700; color: var(--muted); min-height: 38px; }
.segctl button.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .14); }
textarea { width: 100%; border: 1px solid var(--edge); background: var(--bg); border-radius: 12px; padding: 10px 12px; font-family: var(--mono); font-size: 16px; resize: vertical; }
.msg { min-height: 1.4em; }
.scratch { display: grid; gap: 8px; }
.scratch input { width: 100%; font-size: 1.5rem; min-height: 64px; padding: 0 .6em; border: 2px solid var(--edge); border-radius: 14px; background: var(--panel2); outline: none; font-family: var(--sans); }
.scratch input:focus { border-color: var(--acc); background: var(--acc-bg); }

/* ---------- Key points ---------- */
.keypts { background: var(--trk-bg); border-color: color-mix(in srgb, var(--trk) 30%, var(--line)); box-shadow: none; }
.keypts .sec { color: var(--trk-ink); }
.cheat { display: grid; gap: 6px; font-size: .98rem; }
.cheat h4 { margin-top: 10px; font: 700 .76rem/1.2 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--trk-ink); }
.cheat ul { padding-left: 1.15em; display: grid; gap: 4px; }
.cheat .eg { font-family: var(--serif); font-style: italic; font-size: 1.06rem; border-left: 3px solid color-mix(in srgb, var(--trk) 55%, var(--line)); padding: 1px 0 1px 12px; }
.tblw { overflow-x: auto; max-width: 100%; }
.cheat table { border-collapse: collapse; font-size: .92rem; min-width: 100%; background: color-mix(in srgb, var(--panel) 70%, transparent); border-radius: 10px; }
.cheat th, .cheat td { padding: .38em .7em; border-bottom: 1px solid color-mix(in srgb, var(--trk) 24%, var(--line)); text-align: left; vertical-align: top; }
.cheat th { font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--trk-ink); white-space: nowrap; }
.src { font-size: .82rem; color: var(--muted); }
.blocks { padding-left: 1.2em; display: grid; gap: 2px; color: var(--ink); }
.blocks small { color: var(--muted); font-size: .85rem; }
.intro .actions { position: sticky; }

/* ---------- Session ---------- */
.sbar { display: flex; align-items: center; gap: 12px; padding: 14px 0 10px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; }
.sbar .x { width: 40px; height: 40px; flex: none; border: 1px solid var(--line2); background: var(--panel); border-radius: 12px; font-weight: 700; color: var(--muted); }
.segs { flex: 1; display: flex; gap: 4px; min-width: 0; }
.sg { height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; }
.sg i { display: block; height: 100%; background: var(--trk); transition: width .35s; }
.sb-t { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 700; font-size: .9rem; min-width: 3.4em; text-align: right; }
.leave { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--panel2); padding: 10px 14px; border-radius: 14px; }
.leave span { flex: 1 1 14em; font-size: .92rem; }
.card.item { border-top: 3px solid var(--trk); gap: 14px; padding: 20px 22px 24px; }
.card.item > * { min-width: 0; }
.ihead { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.il { font: 700 .76rem/1.2 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--trk-ink); }
.is { font-size: .85rem; color: var(--muted); }
.instr { font: 600 1.02rem/1.4 var(--sans); color: var(--muted); }
.q { font: 500 1.28rem/1.4 var(--serif); text-wrap: pretty; }
.sentence { font-size: 1.32rem; line-height: 2.25; text-wrap: pretty; }
.sentence, .q, .ctext { font-family: var(--serif); }
.sel { display: inline-flex; flex-wrap: wrap; gap: 4px; margin: 0 4px; vertical-align: baseline; }
.so { font: 500 .8em var(--sans); border: 1px solid var(--line2); background: var(--panel); border-radius: 999px; padding: 0 .75em; min-height: 36px; line-height: 1.2; color: var(--ink); }
.so:hover:not(:disabled) { background: var(--panel2); }
.so.on { border-color: var(--acc); background: var(--acc-bg); box-shadow: inset 0 0 0 1px var(--acc); font-weight: 700; }
.so.right { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); font-weight: 700; opacity: 1; box-shadow: none; }
.so.wrong { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); text-decoration: line-through; opacity: 1; box-shadow: none; }
.so:disabled:not(.right):not(.wrong) { opacity: .45; }
.gapw { display: inline-flex; align-items: baseline; gap: 0; white-space: nowrap; max-width: 100%; }

/* ---------- Apple Pencil / handwriting (html[data-pen]) ----------
   Scribble turns handwriting into text inside ordinary text fields, so the job here is to give it room:
   fields at least 52 px tall, clear gaps between them, visible boxes, no auto-focus (that would raise the keyboard),
   and no stray text selection from a pen stroke that starts a little off target. */
html[data-pen] body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

html[data-pen] .w { min-height: 48px; }

@media (min-width: 820px) { #app { max-width: 760px; } body { font-size: 18px; } .sentence { font-size: 1.42rem; } .q { font-size: 1.36rem; } }

:root {

}

.pnl.nb-t { border-top-width: 0; } .pnl.nb-r { border-right-width: 0; } .pnl.nb-b { border-bottom-width: 0; } .pnl.nb-l { border-left-width: 0; }

.pnl .card, .pnl .card.main, .pnl .card.item { background: none; border: 0; box-shadow: none; border-radius: 0; padding: 0; }

/* running a task: progress bar on top, the task scrolls, feedback and buttons stay at the bottom */

/* ---------- DSL ---------- */

/* ---------- parsing ---------- */

/* ---------- state ---------- */

/* ---------- planning ---------- */

/* English Daily - UI */
(() => {

/* English Daily — UI kit shared by the website and the Windows overlay: DOM helpers, storage, theme, item renderers, session runner.
   src/ui/*.js are concatenated by tools/build.js into one closure per target, so everything below is visible to app.js / overlay.js. */
const { TRACKS, TR_KEYS, ITEMS, BYID, LESSONS, smart } = ED;
const KEY = 'englishDaily.v1', SNAPKEY = 'englishDaily.session';
const app = document.getElementById('app');

/* ---------------- tiny DOM helpers ---------------- */
function add(el, kids) { for (const k of kids) { if (k == null || k === false) continue; if (Array.isArray(k)) add(el, k); else el.append(k.nodeType ? k : document.createTextNode(String(k))); } }
function h(spec, props, ...kids) {
  if (props != null && (typeof props !== 'object' || props.nodeType || Array.isArray(props))) { kids.unshift(props); props = null; }
  const mm = spec.match(/^([\w-]*)((?:[.#][\w-]+)*)$/);
  const el = document.createElement(mm[1] || 'div');
  (mm[2].match(/[.#][\w-]+/g) || []).forEach(t => t[0] === '#' ? (el.id = t.slice(1)) : el.classList.add(t.slice(1)));
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'class') String(v).split(' ').filter(Boolean).forEach(c => el.classList.add(c));
    else if (k === 'style' && typeof v === 'object') { for (const [p, x] of Object.entries(v)) { if (p.startsWith('--')) el.style.setProperty(p, x); else el.style[p] = x; } }
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  add(el, kids); return el;
}
const TAGS = /<(\/?)(b|i|u|s|ipa|code|sup|sub|mark|br)\s*\/?>/g;
function rich(str) {
  const frag = document.createDocumentFragment(), stack = [frag]; str = smart(str); let last = 0, m; TAGS.lastIndex = 0;
  while ((m = TAGS.exec(str))) {
    if (m.index > last) stack[stack.length - 1].append(str.slice(last, m.index));
    if (m[2] === 'br') stack[stack.length - 1].append(document.createElement('br'));
    else if (m[1]) { if (stack.length > 1) stack.pop(); }
    else { const e = document.createElement(m[2] === 'ipa' ? 'span' : m[2]); if (m[2] === 'ipa') e.className = 'ipa'; stack[stack.length - 1].append(e); stack.push(e); }
    last = TAGS.lastIndex;
  }
  if (last < str.length) stack[stack.length - 1].append(str.slice(last));
  return frag;
}
const plain = s => String(s).replace(/<[^>]+>/g, '');

/* ---------------- storage ---------------- */
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } },
};
let state = (() => { try { return ED.sanitize(JSON.parse(LS.get(KEY) || 'null')); } catch (e) { return ED.defaultState(); } })();

/* ---------------- theme ---------------- */
function applyTheme() {
  const t = state.prefs.theme, r = document.documentElement;
  if (t === 'light' || t === 'dark') r.setAttribute('data-theme', t); else r.removeAttribute('data-theme');
}

/* ---------------- this device only (never synced): handwriting mode ----------------
   Apple Scribble and Windows ink turn handwriting into text inside ordinary <input> fields, so "pen mode" only gives
   those fields room (see html[data-pen] in style.css) and keeps the page from fighting the pen: no auto-focus, no re-render while writing. */
const Dev = (() => {
  const KEYD = 'englishDaily.device';
  let d = { pen: 'auto', seen: 0 };
  try { const j = JSON.parse(LS.get(KEYD) || 'null'); if (j && typeof j === 'object') d = { pen: j.pen === 'on' || j.pen === 'off' ? j.pen : 'auto', seen: j.seen ? 1 : 0 }; } catch (e) { /* defaults */ }
  const keep = () => LS.set(KEYD, JSON.stringify(d));
  const tablet = () => { try { return matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) >= 640; } catch (e) { return false; } };
  const active = () => d.pen === 'on' || (d.pen === 'auto' && (!!d.seen || tablet()));
  const apply = () => document.documentElement.toggleAttribute('data-pen', active());
  document.addEventListener('pointerdown', e => { if (e.pointerType === 'pen' && !d.seen) { d.seen = 1; keep(); apply(); } }, { capture: true, passive: true });
  return { get mode() { return d.pen; }, get seen() { return !!d.seen; }, active, apply, set(v) { d.pen = v; keep(); apply(); } };
})();

/* ---------------- optional cloud sync (only inside the Claude viewer) ---------------- */
const Sync = (() => {
  let ref = null, busy = false, last = '', timer = null;
  const pack = () => JSON.stringify(state);
  async function pull() {
    if (!ref) return;
    const snap = await ref.get();
    const remote = snap.exists && snap.data() && snap.data().json ? ED.sanitize(JSON.parse(snap.data().json)) : null;
    const local = pack();
    const merged = ED.mergeState(state, remote);
    const mj = JSON.stringify(merged);
    if (mj !== local) { state = merged; LS.set(KEY, mj); applyTheme(); afterRemote(); }
    if (!remote || mj !== JSON.stringify(remote)) await push(true);
    else last = mj;
  }
  async function push(force) {
    if (!ref || busy) return; const j = pack(); if (!force && j === last) return;
    if (j.length > 200000) return;
    busy = true;
    try { await ref.set({ json: j, t: Date.now(), v: 1 }); last = j; } catch (e) { console.warn('sync push failed', e && e.code); }
    busy = false;

  return {
    schedule() { if (!ref) return; clearTimeout(timer); timer = setTimeout(() => push(false), 2500); },
    flush() { if (ref) { clearTimeout(timer); push(false); } },
    async init() {
      try {
        if (!window.claude || !window.claude.use) return;
        const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
        if (!db || !user) return;
        const id = await user.id(); if (!id) return;
        ref = db.doc('data/users/' + id + '/progress');
        await pull();
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull().catch(() => {}); else Sync.flush(); });
        window.addEventListener('pagehide', () => Sync.flush());

    },
  };
})();

/* ---------- Key points (cheat sheet) ---------- */
function cheatEl(lines) {
  const root = h('div.cheat'); let ul = null; const rows = [];
  const isDiv = r => r.length > 0 && r.every(c => /^:?-{2,}:?$/.test(c));
  const flush = () => {
    if (!rows.length) return;
    const head = rows.length > 1 && isDiv(rows[1]) ? rows[0] : null;
    const body = rows.slice(head ? 2 : 0);
    root.append(h('div.tblw', h('table', head ? h('thead', h('tr', head.map(c => h('th', rich(c))))) : null,
      h('tbody', body.map(r => h('tr', r.map(c => h('td', rich(c)))))))));
    rows.length = 0;
  };
  for (const raw of lines) {
    const ln = raw.trimEnd();
    if (ln.startsWith('|')) { ul = null; rows.push(ln.replace(/^\||\|$/g, '').split('|').map(s => s.trim())); continue; }
    flush();
    if (ln.startsWith('- ')) { if (!ul) { ul = h('ul'); root.append(ul); } ul.append(h('li', rich(ln.slice(2)))); continue; }
    ul = null;
    if (ln.startsWith('## ')) root.append(h('h4', rich(ln.slice(3))));
    else if (ln.startsWith('» ')) root.append(h('p.eg', rich(ln.slice(2))));
    else if (ln) root.append(h('p', rich(ln)));
  }
  flush();
  return root;
}

}
function setTrack(el, tr) { el.classList.remove('tA', 'tB', 'tC', 'tD'); if (tr) el.classList.add('t' + tr); }

/* ---------- Task ---------- */
function renderTask() {
  const p = P.task, b = p.body; b.replaceChildren(); b.className = 'pbody'; p.title.replaceChildren();
  if (S && S.phase === 'run') {
    const sp = stepParts(), it = sp.it, tr = it.lesson[0], L = (S.sess.lessonId && sp.step.ph === 'lesson') ? BYID[S.sess.lessonId] : null;
    setTrack(p.el, tr);
    p.title.append(badge(tr, it.lesson), h('b', L ? L.title : stepLabel(sp.step, it)[0]));
    // the feedback belongs under the task it is about (inside the scroll area); only the buttons stay pinned to the bottom
    b.classList.add('run'); b.append(sp.sb, sp.leaveBar, h('div.runscroll', sp.card, sp.bar.querySelector('.fb')), sp.bar);
  } else if (S && S.phase === 'done') {
    setTrack(p.el, S.sess.lessonId ? BYID[S.sess.lessonId].tr : null); p.title.append(h('b', 'Finished')); b.append(doneEl());
  } else if (taskView === 'lib') {
    setTrack(p.el, null); p.title.append(h('b', 'Library')); b.append(libraryEl());
  } else {
    const L = ED.nextLesson(state); setTrack(p.el, L ? L.tr : null); p.title.append(h('b', 'English Daily')); b.append(homeEl(L));
  }
  b.scrollTop = 0;
}
function homeEl(L) {
  const k = dk(), st = ED.streakInfo(state, k), snap = readSnap(), box = h('div.home');
  if (!L) { box.append(h('p.sub', 'No lessons loaded.')); return box; }
  const sess = ED.buildDaily(state, k);
  box.append(h('div.cardhead', badge(L.tr, L.id), h('span.trk', TRACKS[L.tr].name), sess && sess.round > 1 ? h('span.pill', 'round ' + sess.round) : null),
    h('h2', L.title), h('p.sub', L.sub), h('p.meta', sessMeta(L, st.doneToday ? null : sess)));
  if (st.doneToday) box.append(h('p.note', 'Today’s lesson is done. Day ' + st.total + ', streak ' + plural(st.cur, 'day') + '.'));
  if (snap && (!st.doneToday || snap.kind !== 'daily')) {
    const SL = snap.lessonId ? BYID[snap.lessonId] : null;
    box.append(h('div.resume', h('div', h('b', 'Unfinished'), h('p.sub', (SL ? SL.id + ' · ' + SL.title : 'Practice round') + ' · task ' + (snap.i + 1) + ' of ' + snap.steps.length)),
      h('div.row', h('button.btn.primary', { onclick: () => resume(snap) }, 'Resume'), h('button.btn.ghost', { onclick: () => { LS.del(SNAPKEY); render(); } }, 'Discard'))));
  }
  box.append(h('div.row', h('button.btn.primary.big', { onclick: () => launch(st.doneToday ? ED.buildLesson(state, L.id, k) : sess) }, st.doneToday ? 'Start next lesson' : 'Start today’s lesson'),
    h('button.btn.ghost', { onclick: () => showPanel('keypts', true) }, 'Key points'), h('button.btn.ghost', { onclick: () => { taskView = 'lib'; render(); } }, 'Library')));
  const nm = ED.mistakeIds(state).length, anyDone = LESSONS.some(l => ED.lessonN(state, l.id) > 0);
  box.append(h('div.extras', h('h3.sec', 'Extras'),
    h('div.row', h('button.btn.mini', { disabled: !nm, onclick: () => launch(ED.buildMistakes(state, 10)) }, 'Mistake round' + (nm ? ' · ' + nm : '')),
      h('button.btn.mini', { disabled: !anyDone, onclick: () => launch(ED.buildMix(state, k, 12, Date.now() % 997)) }, 'Random mix'))));
  return box;
}
function libraryEl() {
  const k = dk(), box = h('div.lib');
  box.append(h('div.row', h('button.btn.mini', { onclick: () => { taskView = 'home'; render(); } }, '← Back')));
  for (const tr of TR_KEYS) {
    const ls = LESSONS.filter(l => l.tr === tr).sort((a, b) => a.no - b.no); if (!ls.length) continue;
    box.append(h('div.trackblock.t' + tr, h('div.trackhead', badge(tr), h('div', h('h3', TRACKS[tr].name)), h('span.cnt', ls.filter(l => ED.lessonN(state, l.id) > 0).length + '/' + ls.length)),
      h('div.rows', ls.map(l => {
        const rec = state.lessons[l.id];
        return h('button.lrow' + (rec ? '.done' : ''), { onclick: () => { taskView = 'home'; launch(ED.buildLesson(state, l.id, k)); } },
          h('span.code', l.id), h('span.lt', h('b', l.title), h('small', l.items.length + ' tasks · ~' + l.min + ' min')), h('span.ls', rec ? h('span.chk', '✓ ' + rec.best + '%') : h('span.dash', '–')));
      }))));
  }

}
function doneEl() {
  const { sess, sm, L, total, pct, right, missed, title, later } = resultData(), box = h('div.done');
  box.append(h('h2', title), L ? h('p.sub', L.id + ' · ' + L.title) : null,
    h('div.scorecard', h('div.bigscore', h('b', pct + '%'), h('span', 'right first time')),
      h('div.rs', h('div', h('b', right + '/' + total), h('span', 'perfect')), h('div', h('b', mmss(sm.ms)), h('span', 'minutes')), h('div', h('b', sm.st.cur), h('span', 'day streak')))));
  if (later.length) box.append(h('p.note', plural(later.length, 'task') + ' will come back as review tomorrow.'));
  if (missed.length) box.append(h('div.missed', h('h3.sec', 'What you missed'), h('ul.misslist', missed.slice(0, 6).map(r => {
    const it = ITEMS[r.id];
    return h('li', h('small', it.lesson + ' · ' + plain(it.instr)), h('p', it.t === 'ctest' ? 'C-test: ' + r.got + '/' + r.of + ' gaps' : it.t === 'stress' ? h('code', ED.solution(it)) : rich(ED.solution(it))), it.ex ? h('p.why', rich(it.ex)) : null);
  }))));
  const nextL = ED.nextLesson(state);
  box.append(h('div.row', h('button.btn.primary.big', { onclick: () => { S = null; taskView = 'home'; render(); } }, 'Done'),
    L && sess.kind !== 'mistakes' ? h('button.btn.ghost', { onclick: () => showPanel('keypts', true) }, 'Key points') : null,
    sess.kind === 'daily' && nextL ? h('button.btn.ghost', { onclick: () => launch(ED.buildLesson(state, nextL.id, dk())) }, 'Next lesson') : null));
  return box;
}

/* ---------- Progress ---------- */
function renderProg() {
  const p = P.prog; if (p.el.hidden) return;
  const k = dk(), st = ED.streakInfo(state, k), bx = ED.boxCounts(state, k);
  p.body.replaceChildren(h('div.pg-top', h('b.day', st.doneToday ? 'Day ' + st.total + ' done' : 'Day ' + (st.total + 1)), h('span.streak' + (st.doneToday ? '.on' : ''), h('b', st.cur), st.cur === 1 ? ' day' : ' days')),
    weekStrip(k), h('p.sub', bx.due + ' due · ' + bx.total + ' in the review boxes'));
}

/* ---------- Key points: the lesson of the task in front of you ---------- */
function keyLessonNow() {
  if (S && S.phase === 'run') { const st = S.sess.steps[S.i], it = st && ITEMS[st.id]; if (it && BYID[it.lesson]) return BYID[it.lesson]; }
  if (S && S.sess.lessonId) return BYID[S.sess.lessonId];
  return ED.nextLesson(state);
}
function renderKey(force) {
  const p = P.keypts; if (p.el.hidden) return;
  const L = keyLessonNow(), id = L ? L.id : null;
  if (!force && id === keyLesson) return;
  keyLesson = id; p.title.replaceChildren(); p.body.replaceChildren(); setTrack(p.el, L ? L.tr : null);
  if (!L) return;
  p.title.append(badge(L.tr, L.id), h('b', L.title));
  p.body.append(cheatEl(L.cheat), L.src ? h('p.src', 'Source: ', rich(L.src)) : null); p.body.scrollTop = 0;
}

/* ---------- Settings ---------- */
function renderSet() {
  const p = P.set, b = p.body; b.replaceChildren();
  const seg = (opts, cur, fn) => h('div.segctl', opts.map(([v, t]) => h('button' + (v === cur ? '.on' : ''), { type: 'button', 'aria-pressed': v === cur, onclick: () => fn(v) }, t)));
  const row = (label, ctl, sub) => h('div.setrow', h('div', h('b', label), sub ? h('p.sub', sub) : null), ctl);
  const again = fn => v => { fn(v); renderSet(); };
  const op = h('input', { type: 'range', min: 40, max: 100, step: 5, value: Math.round(lay.op * 100), 'aria-label': 'Opacity', oninput: e => { lay.op = e.target.value / 100; applyLook(); }, onchange: () => saveLay() });
  b.append(
    row('Appearance', seg([['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']], state.prefs.theme, again(v => { state.prefs.theme = v; state.prefs.t = Date.now(); save(); applyTheme(); }))),
    row('Text size', seg([[14, 'S'], [15, 'M'], [17, 'L']], lay.fs, again(v => { lay.fs = v; applyLook(); saveLay(); }))),
    row('Opacity', op),
    row('Dim when idle', seg([[0, 'Off'], [1, 'On']], lay.idle, again(v => { lay.idle = v; applyLook(); saveLay(); })), 'Fades panels the pointer is not on'),
    row('Pencil mode', seg([['auto', 'Auto'], ['on', 'On'], ['off', 'Off']], Dev.mode, again(v => Dev.set(v))), 'Larger fields for a pen'),
    row('Layout', h('button.btn.mini', { onclick: () => resetLayout() }, 'Reset')));
  if (TAURI) {
    const au = h('div.segctl');
    const scr = row('Screen', h('button.btn.mini', { onclick: () => host('monitor_next').then(renderSet) }, 'Next screen'), 'Moves the overlay to another monitor');
    const ovr = row('Overlay', h('div.row', h('button.btn.mini', { onclick: () => host('hide') }, 'Hide'), h('button.btn.mini.danger', { onclick: () => host('quit') }, 'Quit')), 'Ctrl+Alt+E shows or hides it');
    b.append(scr, row('Start with Windows', au), ovr);
    host('status').then(st => {                  // what only the host knows: how many screens, and whether the shortcut was free
      if (!st) return;
      scr.querySelector('.sub').textContent = st.monitors > 1 ? 'Screen ' + st.monitor + ' of ' + st.monitors : 'Only one screen found';
      if (!st.shortcut) ovr.querySelector('.sub').textContent = 'Ctrl+Alt+E is taken by another app. The tray icon shows or hides it.';
    });
    host('autostart_get').then(on => { au.replaceChildren(...[[0, 'Off'], [1, 'On']].map(([v, t]) => h('button' + ((on ? 1 : 0) === v ? '.on' : ''), { type: 'button', onclick: () => host('autostart_set', { on: !!v }).then(renderSet) }, t))); });

  b.append(h('div.setrow.col', h('b', 'Backup'),
    h('div.row', h('button.btn.mini', { onclick: async () => { const t = JSON.stringify(state); ta.value = t; try { await navigator.clipboard.writeText(t); msg.textContent = 'Copied.'; } catch (e) { ta.select(); msg.textContent = 'Select and copy the text.'; } } }, 'Copy'),
      h('button.btn.mini', { onclick: () => { try { if (!ta.value.trim()) throw new Error('empty'); state = ED.mergeState(state, ED.sanitize(JSON.parse(ta.value))); save(); applyTheme(); msg.textContent = 'Merged.'; render(); } catch (e) { msg.textContent = 'That does not look like a backup.'; } } }, 'Restore')), ta, msg),
    h('p.hint2', 'Drag a header to move. Panels that touch dock and move together. Alt detaches one, Shift turns snapping off. Double-click a header to roll it up.'));
}

/* ---------------- boot ---------------- */
window.addEventListener('pagehide', () => { try { writeSnap(); } catch (e) { /* ignore */ } });
document.documentElement.classList.add('ov');

loadLayout(); buildChrome(); applyLook();
for (const id of IDS) { clampPanel(P[id]); place(P[id]); }
render(); fit(); syncButtons();
window.addEventListener('resize', onResize);
if (TAURI && TAURI.event && TAURI.event.listen) TAURI.event.listen('overlay:reset', () => resetLayout());
setTimeout(() => host('ready'), 40);           // the host shows the window once the regions are set (a hidden page gets no animation frames, so no rAF here)
ED.ui = { get state() { return state; }, set state(v) { state = v; }, render, start: launch, get S() { return S; }, save, resume, Dev };
